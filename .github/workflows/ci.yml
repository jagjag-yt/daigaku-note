# プッシュ・プルリクエストのたびに動く確認。
#   test:    ふつうのテスト(npm test)
#   ui:      画面の崩れのテスト(iPhone・Android・iPad・PC の大きさ × Chromium・WebKit)
#   android: Android アプリ(APK)を作って、ダウンロードできるようにする
name: 確認
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 基準のスクショをブランチに足すため
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ブラウザ(Chromium・WebKit)を入れる
        run: npx playwright install --with-deps chromium webkit
      # 基準のスクショは、文字の描かれ方がそろうようにこの環境で作る。
      #   まだない画面 → この回は作るだけで合格にし、ブランチに足す(main 以外へのプッシュのときだけ)。次から比べる
      #   見た目をわざと変えたとき → コミットのメッセージに [update-screenshots] と書くと、違う画面を作り直す
      - name: 画面の崩れのテスト
        env:
          UPDATE: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-screenshots]') && 'changed' || 'missing' }}
        run: npx playwright test --update-snapshots=$UPDATE
      - name: 作った基準のスクショをブランチに足す
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git add test/ui/__screenshots__
          if git diff --cached --quiet; then echo "足すものはありません"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "画面の崩れのテスト: 基準のスクショを更新"
          git push
      - name: 結果(違いの画像つき)を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: 画面のファイルをアプリに入れる
        run: npm run build:web && npx cap sync android
      - name: APK を作る
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: daigaku-note-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
