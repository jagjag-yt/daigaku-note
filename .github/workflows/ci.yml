# プッシュ・プルリクエストのたびに動く確認。
#   test:    ふつうのテスト(npm test)
#   ui:      画面の崩れのテスト(iPhone・Android・iPad・PC の大きさ × Chromium・WebKit)
#   android: Android アプリ(APK)を作って、ダウンロードできるようにする
name: 確認
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ui:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 基準のスクショをブランチに足すため
      actions: write # 足したコミットにも確認を走らせるため
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ブラウザ(Chromium・WebKit)を入れる
        run: npx playwright install --with-deps chromium webkit
      # 基準のスクショは、文字の描かれ方がそろうようにこの環境(ubuntu-24.04 に固定)で作る。
      #   まだない画面 → 1回目で作り、2回目で比べる。main 以外へのプッシュなら、作った基準をブランチに足す
      #   見た目をわざと変えたとき → コミットのメッセージに [update-screenshots] と書くと、違う画面を作り直す
      - name: 基準のスクショを作る(まだないもの)
        env:
          UPDATE: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-screenshots]') && 'changed' || 'missing' }}
        run: npx playwright test --update-snapshots=$UPDATE --reporter=dot || true
      - name: 画面の崩れのテスト
        run: npx playwright test --update-snapshots=none
      - name: 作った基準のスクショをブランチに足す
        if: success() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          # 基準は手元で作らない(.gitignore に入れてある)ので、ここだけ -f で足す
          git add -f test/ui/__screenshots__
          if git diff --cached --quiet; then echo "足すものはありません"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "画面の崩れのテスト: 基準のスクショを更新"
          git push
          # このトークンでのプッシュでは確認が自動で走らないので、足したコミットにも走らせる(PR のチェックが付くように)
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: アプリ版(Android)の動きをブラウザで再現して確かめる
        if: success() || failure()
        run: |
          node serve.mjs 8124 & node test/davserver.mjs 8125 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8124/ && curl -s -o /dev/null http://localhost:8125/ && break; sleep 1; done
          node test/native-e2e.cjs
      - name: 結果(違いの画像つき)を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: 画面のファイルをアプリに入れる
        run: npm run build:web && npx cap sync android
      - name: APK を作る
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: daigaku-note-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
